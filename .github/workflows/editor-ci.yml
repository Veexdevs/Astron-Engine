# ============================================================
# Astron Engine — CI do editor web (React + Vite)
# ============================================================
name: 🌐 Editor Web (CI)

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build do editor
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: astron-editor-dist
          path: dist/
          if-no-files-found: error
