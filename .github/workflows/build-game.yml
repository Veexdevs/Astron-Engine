# ============================================================
# Astron Engine — Builds dos jogos (C# / .NET 8)
# Gera: APK (Android) · IPA (iOS) · EXE (Windows) · Linux
# ============================================================
name: 🎮 Build do Jogo

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma a buildar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - windows
          - linux
  push:
    branches: [ main ]
    paths:
      - 'games/**'
      - '.github/workflows/build-game.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'games/**'
      - '.github/workflows/build-game.yml'

permissions:
  contents: write

jobs:
  # ---------------- EXE (Windows) ----------------
  windows:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      inputs.platform == 'all' ||
      inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore games/AstronGame/Desktop/AstronGame.Desktop.csproj

      - name: Publish (win-x64, self-contained, single-file)
        run: >
          dotnet publish games/AstronGame/Desktop/AstronGame.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -o out/windows

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AstronGame-windows-x64
          path: out/windows/
          if-no-files-found: error

  # ---------------- Linux ----------------
  linux:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      inputs.platform == 'all' ||
      inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore games/AstronGame/Desktop/AstronGame.Desktop.csproj

      - name: Publish (linux-x64, self-contained)
        run: >
          dotnet publish games/AstronGame/Desktop/AstronGame.Desktop.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -o out/linux

      - name: Empacotar (.tar.gz)
        run: |
          chmod +x out/linux/AstronGame
          tar -czf AstronGame-linux-x64.tar.gz -C out/linux .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: AstronGame-linux-x64
          path: AstronGame-linux-x64.tar.gz
          if-no-files-found: error

  # ---------------- APK (Android) ----------------
  android:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      inputs.platform == 'all' ||
      inputs.platform == 'android'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install workload Android
        run: dotnet workload install android

      - name: Gerar keystore de release
        run: >
          keytool -genkeypair -v
          -keystore release.keystore
          -alias astron
          -keyalg RSA -keysize 2048
          -validity 10000
          -storepass astron123
          -keypass astron123
          -dname "CN=Astron Engine, OU=Games, O=Veexdevs, L=Sao Paulo, C=BR"

      - name: Build + Sign APK
        run: >
          dotnet publish games/AstronGame/Android/AstronGame.Android.csproj
          -c Release -f net10.0-android
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="${{ github.workspace }}/release.keystore"
          -p:AndroidSigningKeyAlias=astron
          -p:AndroidSigningKeyPass=astron123
          -p:AndroidSigningStorePass=astron123

      - name: Localizar APK assinado
        run: |
          set -e
          mkdir -p artifacts
          APK=$(find games -name "*-Signed.apk" | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find games -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "Nenhum APK encontrado"; exit 1
          fi
          cp "$APK" artifacts/AstronGame-release.apk
          ls -la artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstronGame-android-apk
          path: artifacts/AstronGame-release.apk
          if-no-files-found: error

  # ---------------- IPA (iOS) ----------------
  ios:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      inputs.platform == 'all' ||
      inputs.platform == 'ios'
    runs-on: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 (10.0.401 para Xcode 26.6)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Install workload iOS (10.0.401 para Xcode 26.6)
        run: dotnet workload install ios --version 10.0.401

      - name: Selecionar Xcode real (sem symlink) compatível com workload iOS
        run: |
          ls -lad /Applications/*Xcode* || true
          SDK_XML=$(find /usr/local/share/dotnet "$HOME/.dotnet" -name "SdkVersions.xml" 2>/dev/null | grep -i "iOS" | head -n 1 || true)
          TARGET_APP=""
          if [ -n "$SDK_XML" ]; then
            REQ=$(python3 -c 'import re,sys; t=open(sys.argv[1]).read(); m=re.search(r"Xcode[>=<\x22\s]*([0-9]+\.[0-9]+)", t); print(m.group(1) if m else "")' "$SDK_XML")
            echo "Workload iOS ($SDK_XML) solicita Xcode: $REQ"
            if [ -n "$REQ" ]; then
              for cand in /Applications/Xcode_"${REQ}"*.app; do
                if [ -e "$cand" ]; then
                  TARGET_APP=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$cand")
                fi
              done
            fi
          fi
          if [ -z "$TARGET_APP" ]; then
            LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$LATEST" ]; then
              TARGET_APP=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$LATEST")
            fi
          fi
          if [ -n "$TARGET_APP" ] && [ -d "$TARGET_APP/Contents/Developer" ]; then
            echo "Selecionando diretório real do Xcode: $TARGET_APP/Contents/Developer"
            sudo xcode-select -s "$TARGET_APP/Contents/Developer"
          fi
          xcode-select -p
          xcodebuild -version
          if ! xcodebuild -showsdks | grep -qi iphoneos; then
            echo "Baixando plataforma iOS para o Xcode selecionado..."
            xcodebuild -downloadPlatform iOS
          fi

      - name: Build iOS (.app arm64)
        run: |
          set -o pipefail
          build_ios() {
            dotnet build games/AstronGame/iOS/AstronGame.iOS.csproj \
              -c Release -f net10.0-ios -r ios-arm64 \
              -p:EnableCodeSigning=false \
              -p:CodesignKey="" \
              -p:CodesignProvision="" \
              -p:CodesignEntitlements=""
          }
          build_ios 2>&1 | tee ios_build.log || {
            REQ_XC=$(python3 -c 'import re; t=open("ios_build.log").read(); m=re.search(r"requires Xcode ([0-9]+\.[0-9]+)", t); print(m.group(1) if m else "")')
            if [ -n "$REQ_XC" ]; then
              for cand in /Applications/Xcode_"${REQ_XC}"*.app; do
                if [ -e "$cand" ]; then
                  REAL_XC=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$cand")
                  echo "Re-selecionando Xcode real exigido: $REAL_XC/Contents/Developer"
                  sudo xcode-select -s "$REAL_XC/Contents/Developer"
                  break
                fi
              done
              if ! xcodebuild -showsdks | grep -qi iphoneos; then
                xcodebuild -downloadPlatform iOS
              fi
              build_ios 2>&1 | tee ios_build_retry.log || {
                grep -iE "error" ios_build_retry.log | head -n 15 | while IFS= read -r line; do
                  echo "::error::$line"
                done
                exit 1
              }
            else
              grep -iE "error" ios_build.log | head -n 15 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            fi
          }

      - name: Empacotar IPA (Payload/*.app)
        run: |
          set -e
          mkdir -p artifacts
          IPA=$(find games -name "*.ipa" | head -n 1)
          if [ -n "$IPA" ]; then
            cp "$IPA" artifacts/AstronGame-ios.ipa
          else
            APP=$(find games -name "*.app" -type d | head -n 1)
            if [ -z "$APP" ]; then
              echo "Nenhum .app encontrado"; exit 1
            fi
            STAGE=$(mktemp -d)
            mkdir -p "$STAGE/Payload"
            cp -R "$APP" "$STAGE/Payload/"
            (cd "$STAGE" && zip -qr AstronGame-ios.ipa Payload)
            cp "$STAGE/AstronGame-ios.ipa" artifacts/
          fi
          ls -la artifacts/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AstronGame-ios-ipa
          path: artifacts/AstronGame-ios.ipa
          if-no-files-found: error

  # ---------------- Release (tags v*) ----------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          pattern: AstronGame-*
          path: dist/
          merge-multiple: true

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**
          generate_release_notes: true
